<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1013">
<title>扶摇 · 九万里</title>
<style>
/* VOICE: quiet and classical, a hanging scroll that breathes.
   IDEA: the game is a living ink painting of Zhuangzi's "Free and Easy Wandering": a flock rises from the Northern Darkness through nine heavens.
   PICTURE: a full-bleed canvas of procedural ink-wash cliffs, mist and birds; the DOM only carries calligraphy and seals.
   COLOUR and TYPE: rice paper, burnt ink and one cinnabar seal; the ninth heaven turns azurite, malachite and gold. Zhi Mang Xing for titles, Ma Shan Zheng for text, set vertically.
   LAYOUT: portrait first; flock count top-left, a vertical altitude scroll on the right, cards and seals inside the safe areas. */
@font-face{font-family:FYT;src:url(data:font/woff2;base64,__FYT__) format("woff2");font-display:block}
@font-face{font-family:FYK;src:url(data:font/woff2;base64,__FYK__) format("woff2");font-display:block}
:root{color-scheme:light;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--zhu:#b3312a;--hud:#1d1a16;--hudr:29,26,22;--shd:236,230,216;--sealm:none}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b1013;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:FYK,"Kaiti SC",STKaiti,KaiTi,serif;color:var(--hud);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
body.dk{--hud:#efe8d7;--hudr:239,232,215;--shd:8,10,18}
#g{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#paper,#vig{position:fixed;inset:0;pointer-events:none}
#paper{mix-blend-mode:multiply;opacity:.5;background-size:256px 256px}
#vig{background:radial-gradient(120% 92% at 50% 45%,rgba(0,0,0,0) 56%,rgba(38,26,12,.34) 100%);mix-blend-mode:multiply}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--zhu);color:#f8efe0;font-family:FYT,serif;font-weight:400;line-height:1;border-radius:3px;writing-mode:vertical-rl;-webkit-mask-image:var(--sealm);mask-image:var(--sealm);-webkit-mask-size:100% 100%;mask-size:100% 100%}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .8s}
#hud.off{opacity:0}
#hud.off #btns{pointer-events:none}
#cnt{position:absolute;left:calc(var(--sl) + 14px);top:calc(var(--st) + 14px);display:flex;align-items:center;gap:10px;font-size:27px;line-height:1;text-shadow:0 0 10px rgba(var(--shd),.8)}
#cnt .seal{width:31px;height:31px;font-size:21px}
#cntv{display:inline-block;min-width:3ch;transition:transform .18s ease-out,color .2s,text-shadow .2s}
.sealw{position:relative;display:inline-grid;place-items:center;--w:0}
.sealw::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(rgba(var(--hudr),.62) calc(var(--w) * 360deg),rgba(var(--hudr),.14) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.sealw.full::before{background:#d9a640;filter:drop-shadow(0 0 6px rgba(240,190,80,.9));animation:breathe 1.2s ease-in-out infinite}
.sealw .seal{transition:filter .25s,opacity .25s}
.sealw.cd .seal{filter:grayscale(1) brightness(1.1);opacity:.5}
#bFy{position:absolute;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 17vh);width:66px;height:66px;font-size:40px;border:0;padding:0;cursor:pointer;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .35s,transform .35s}
#bFy.on{opacity:1;pointer-events:auto;transform:scale(1);animation:pulse 1.3s ease-in-out infinite}
#hud.off #bFy{pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#cntv.pop{transform:scale(1.28)}
#cntv.gold{color:#e0a43a;text-shadow:0 0 12px rgba(240,190,80,.95)}
#btns{position:absolute;left:calc(var(--sl) + 4px);top:calc(var(--st) + 52px);display:flex;gap:2px;pointer-events:auto}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--hud);display:grid;place-items:center;cursor:pointer;opacity:.72}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,.btn:focus-visible,#title:focus-visible{outline:2px solid var(--zhu);outline-offset:3px}
#alt{position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 16px);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:10px}
#altv{writing-mode:vertical-rl;font-size:22px;line-height:1.1;letter-spacing:.06em;text-shadow:0 0 10px rgba(var(--shd),.85)}
#prog{position:relative;width:3px;height:min(32vh,250px);margin-top:4px;border-radius:2px;background:rgba(var(--hudr),.16)}
#progf{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:2px;background:var(--zhu)}
#prog b{position:absolute;left:-3px;width:9px;height:1px;background:rgba(var(--hudr),.42)}
#card{position:fixed;left:calc(var(--sl) + 6vw);top:calc(var(--st) + 16vh);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:12px;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 1.1s ease,transform 1.8s ease;text-shadow:0 0 14px rgba(var(--shd),.9)}
#card.on{opacity:1;transform:none}
#card .cn{writing-mode:vertical-rl;font-size:18px;letter-spacing:.3em;opacity:.82}
#card .cm{writing-mode:vertical-rl;font-family:FYT,serif;font-size:clamp(64px,17vw,118px);line-height:1}
#card .cq{font-size:clamp(17px,4.4vw,22px);line-height:1.55;letter-spacing:.14em;margin-top:8px;opacity:.92}
#card .cs{writing-mode:vertical-rl;font-size:13px;letter-spacing:.2em;margin-top:12px;opacity:.62}
#card .cm{position:relative}
#card .cm::before{content:'';position:absolute;left:50%;top:50%;width:2.4em;height:2.4em;margin:-1.2em 0 0 -1.2em;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--hudr),.16),rgba(var(--hudr),.06) 55%,rgba(var(--hudr),0));z-index:-1;opacity:0;transform:scale(.2)}
#card.on .cm{animation:bloom 1.8s cubic-bezier(.2,.7,.2,1) both}
#card.on .cm::before{animation:blot 2.4s ease-out both}
#card.on .cq span{animation:bloom 1.5s cubic-bezier(.2,.7,.2,1) .35s both}
#card.on .cq span:nth-child(2){animation-delay:.6s}
#card.on .cq span:nth-child(3){animation-delay:.85s}
@keyframes bloom{0%{opacity:0;filter:blur(9px);transform:scale(1.14)}55%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes blot{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:.85;transform:scale(1)}}
#fint{position:fixed;left:calc(var(--sl) + 9vw);top:calc(var(--st) + 10vh);display:flex;flex-direction:row-reverse;gap:14px;pointer-events:none;opacity:0;transition:opacity 2s ease;color:#3b2a0e;text-shadow:0 0 18px rgba(255,246,224,.95)}
#fint.on{opacity:1}
#fint .a{writing-mode:vertical-rl;font-family:FYT,serif;font-size:clamp(36px,10vw,64px);line-height:1.05;letter-spacing:.06em}
#fint .b{writing-mode:vertical-rl;font-size:clamp(16px,4.4vw,21px);letter-spacing:.2em;margin-top:30px;opacity:.85}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 15vh);transform:translate(-50%,8px);max-width:92vw;padding:6px 14px;font-size:17px;letter-spacing:.06em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .6s,transform .6s;text-shadow:0 0 10px rgba(var(--shd),.95),0 0 3px rgba(var(--shd),.9)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#hint{position:fixed;left:50%;bottom:calc(var(--sb) + 22vh);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:17px;letter-spacing:.12em;opacity:0;pointer-events:none;transition:opacity .8s;text-shadow:0 0 10px rgba(var(--shd),.95)}
#hint.on{opacity:.92}
#hint svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;animation:sway 1.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-24px)}50%{transform:translateX(24px)}}
#rot{display:none}
@media (orientation:landscape) and (pointer:coarse) and (max-height:520px){#rot{display:block;position:fixed;left:50%;bottom:calc(var(--sb) + 8px);transform:translateX(-50%);font-size:13px;letter-spacing:.2em;opacity:.7;pointer-events:none;color:#efe8d7}}
.scr{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .9s ease}
.scr.on{opacity:1;pointer-events:auto}
#title{cursor:pointer;outline:none}
#title .tc{position:absolute;right:calc(var(--sr) + 10vw);top:calc(var(--st) + 8vh);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:clamp(12px,3.4vw,26px)}
#title .tm{display:flex;flex-direction:column;align-items:center;gap:16px}
#title .tt{writing-mode:vertical-rl;font-family:FYT,serif;font-size:clamp(92px,26vw,180px);line-height:.95;color:#14120f;text-shadow:0 0 30px rgba(242,238,226,.6)}
#title .tm .seal{width:46px;height:62px;font-size:21px}
#title .tq{writing-mode:vertical-rl;font-size:clamp(17px,4.6vw,23px);line-height:1.75;letter-spacing:.2em;color:rgba(24,21,17,.82);margin-top:14px;text-shadow:0 0 12px rgba(242,238,226,.8)}
#title .tf{position:absolute;left:0;right:0;bottom:calc(var(--sb) + 19.5vh);text-align:center;color:#1d1a16;text-shadow:0 0 14px rgba(240,236,226,.95),0 0 4px rgba(240,236,226,.9)}
#title .tap{font-size:clamp(23px,6.2vw,31px);letter-spacing:.32em;padding-left:.32em;animation:breathe 2.6s ease-in-out infinite}
#title .snd{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 8px;margin-bottom:14px;font-size:15px;letter-spacing:.14em;opacity:.8}
#title .snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#title .snd .sub{flex-basis:100%;font-size:13px;opacity:.85}
#title .snd .sub:empty{display:none}
#title .snd.off{cursor:pointer;opacity:.95}
#title .snd.off .sub{text-decoration:underline;text-underline-offset:4px}
#title .best{margin-top:4px;font-size:14px;letter-spacing:.12em;opacity:.6;min-height:1.2em}
#cred{position:fixed;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);width:max-content;max-width:94vw;text-align:center;font-size:12px;line-height:1.6;letter-spacing:.06em;color:rgba(236,230,214,.55);opacity:0;pointer-events:none;transition:opacity .9s ease}
#title.on+#cred{opacity:1;pointer-events:auto}
#cred a{color:inherit;text-underline-offset:2px}
@media (max-height:520px){#cred{left:auto;right:calc(var(--sr) + 14px);transform:none;text-align:right;font-size:11px}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 24px);overflow:auto;width:min(86vw,400px);padding:28px 22px 26px;border-radius:6px;background:rgba(241,235,221,.93);box-shadow:0 14px 48px rgba(0,0,0,.28);color:#1d1a16;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.sheet h2{font-family:FYT,serif;font-weight:400;font-size:clamp(50px,14vw,74px);line-height:1}
.sheet .q{font-size:clamp(20px,5.6vw,25px);line-height:1.7;letter-spacing:.18em}
.sheet .q2{font-size:17px;line-height:1.75;letter-spacing:.1em;max-width:22em}
.sheet .src{font-size:13px;letter-spacing:.2em;opacity:.6;margin-top:-8px}
.sheet .stt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;font-size:16px;letter-spacing:.06em}
.sheet .stt b{font-weight:400;font-size:22px;white-space:nowrap}
.sheet .rec{font-size:15px;color:var(--zhu);min-height:1.3em;letter-spacing:.1em}
.btn{min-width:150px;height:54px;border:0;border-radius:4px;background:var(--zhu);color:#f8efe0;font-family:FYT,serif;font-size:29px;letter-spacing:.32em;padding-left:.32em;cursor:pointer;-webkit-mask-image:var(--sealm);mask-image:var(--sealm);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.ttl{display:flex;align-items:baseline;gap:.35em;font-size:16px;letter-spacing:.24em;opacity:.9}
.ttl b{font-family:FYT,serif;font-weight:400;font-size:44px;line-height:1;letter-spacing:.06em;color:var(--zhu)}
.bts{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn2{-webkit-mask-image:none;mask-image:none;background:transparent;color:var(--zhu);border:1.5px solid rgba(179,49,42,.7);height:46px;font-size:22px;letter-spacing:.2em;padding-left:.2em}
.btn[hidden]{display:none}
.lks{display:flex;justify-content:center;gap:24px;margin-top:10px}
.lk{background:none;border:0;border-bottom:1px solid rgba(29,26,22,.35);color:inherit;font:inherit;font-size:16px;letter-spacing:.2em;padding:6px 2px;cursor:pointer;opacity:.9;text-decoration:none}
#share{background:rgba(18,16,12,.62);display:grid;place-items:center}
#fcard{position:fixed;right:calc(var(--sr) + 15vw);top:calc(var(--st) + 24vh);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:9px;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform 1.4s ease;text-shadow:0 0 12px rgba(var(--shd),.95)}
#fcard.on{opacity:1;transform:none}
#fcard .seal{width:26px;height:26px;font-size:16px}
#fcard .fn{writing-mode:vertical-rl;font-family:FYT,serif;font-size:clamp(30px,8vw,44px);line-height:1;letter-spacing:.06em}
#fcard .fq{font-size:16px;line-height:1.5;letter-spacing:.16em;margin-top:6px}
#fcard .fs{writing-mode:vertical-rl;font-size:12px;letter-spacing:.2em;margin-top:8px;opacity:.65}
#fcard.on .fn{animation:bloom 1.6s cubic-bezier(.2,.7,.2,1) both}
#scroll{background:rgba(18,16,12,.35)}
.sbook{max-width:min(92vw,420px)}
.fgrid{display:grid;grid-template-rows:repeat(3,auto);grid-auto-flow:column;direction:rtl;gap:8px;justify-content:center}
.fcell{direction:ltr;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:4px;min-width:86px;min-height:136px;padding:8px 6px;border:1px solid rgba(29,26,22,.14);border-radius:3px;background:rgba(255,255,255,.28)}
.fcell b{writing-mode:vertical-rl;font-family:FYT,serif;font-weight:400;font-size:22px;line-height:1.05;color:var(--zhu)}
.fcell .vq{font-size:12px;line-height:1.45;letter-spacing:.1em;opacity:.85}
.fcell.no b{color:rgba(29,26,22,.3)}
.fcell.no small{writing-mode:vertical-rl;font-size:12px;letter-spacing:.14em;opacity:.55}
#share .sbox{display:flex;flex-direction:column;align-items:center;gap:12px}
#shareImg{max-height:74vh;max-width:86vw;border-radius:3px;box-shadow:0 14px 44px rgba(0,0,0,.45);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;touch-action:auto}
#share .shint{color:#efe7d6;font-size:15px;letter-spacing:.2em;opacity:.85}
#share .lk{color:#efe7d6;border-bottom-color:rgba(239,231,214,.5)}
#win .sheet{top:auto;bottom:calc(var(--sb) + 5vh);transform:translateX(-50%);background:rgba(246,238,218,.9)}
.vq{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:.35em}
.vq span{writing-mode:vertical-rl;white-space:nowrap}
#fint .a,#fint .b{white-space:nowrap}
#err{display:none;position:fixed;left:16px;right:16px;bottom:16px;padding:12px;border-radius:6px;background:#f1ebdd;color:#5a1b16;font-size:15px}
@media (max-height:520px){#card{left:calc(var(--sl) + 18vw);top:calc(var(--st) + 7vh)}#card .cm{font-size:clamp(48px,13vh,90px)}#title .tc{top:calc(var(--st) + 4vh)}#title .tt{font-size:clamp(64px,22vh,120px)}#title .tf{right:auto;width:60vw;bottom:calc(var(--sb) + 14vh)}#over .sheet,#win .sheet{width:min(92vw,680px);display:grid;grid-auto-flow:row dense;grid-template-columns:auto 1fr;column-gap:28px;row-gap:8px;padding:16px 24px;align-items:center;justify-items:center}#over .sheet .q{grid-column:1;grid-row:1 / span 7}#over .sheet>:not(.q){grid-column:2}#win .sheet{grid-template-columns:1fr 1fr;top:50%;bottom:auto;transform:translate(-50%,-50%)}#win .sheet h2{font-size:56px}#win .sheet h2,#win .sheet .ttl,#win .sheet .q2{grid-column:1}#win .sheet>:not(h2):not(.ttl):not(.q2){grid-column:2}.bts{flex-direction:row}.sbook{max-width:none;width:min(94vw,720px);padding:14px 18px;gap:10px}#scroll .sheet h2{font-size:42px}.fgrid{grid-template-rows:none;grid-template-columns:repeat(9,auto)}.fcell{min-width:62px;min-height:150px}}
@media (prefers-reduced-motion:reduce){#title .tap,#hint svg,#card.on .cm,#card.on .cm::before,#card.on .cq span,#bFy.on,.sealw.full::before{animation:none}#card{transition:opacity .4s}}
</style>
</head>
<body>
<canvas id="g" aria-label="扶摇：水墨鸟群飞行游戏"></canvas>
<div id="paper"></div>
<div id="vig"></div>
<div id="hud" class="off">
  <div id="cnt"><span class="sealw" id="sealW"><span class="seal">羽</span></span><span id="cntv">0</span></div>
  <button id="bFy" class="seal" aria-label="抟扶摇而上" tabindex="-1">扶</button>
  <div id="btns">
    <button class="ib" id="bSnd" aria-label="声音开关"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="sndOn" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path id="sndOff" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg></button>
    <button class="ib" id="bPau" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11"/></svg></button>
  </div>
  <div id="alt"><div id="altv">零里</div><div id="prog"><i id="progf"></i></div></div>
</div>
<div id="card"><div class="cn" id="cN"></div><div class="cm" id="cM"></div><div class="cq vq" id="cQ"></div><div class="cs" id="cS"></div></div>
<div id="fcard" aria-live="polite"><span class="seal">寓</span><div class="fn" id="fN"></div><div class="fq vq" id="fQ"></div><div class="fs" id="fS"></div></div>
<div id="fint"><div class="a">抟扶摇而上者九万里</div><div class="b">鹏之徙于南冥也</div></div>
<div id="hint"><svg viewBox="0 0 48 48"><path d="M20 30V13a3 3 0 0 1 6 0v11l7 1.6a4 4 0 0 1 3 4.6L34.6 38a5 5 0 0 1-4.9 4H24a5 5 0 0 1-4-2l-6.2-8.3a2.6 2.6 0 0 1 4-3.3z"/><path d="M12 8l-4 4 4 4M36 8l4 4-4 4"/></svg><span id="hintT">拖动 · 引领鸟群</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="rot">竖屏游玩更佳</div>
<div id="title" class="scr on" role="button" tabindex="0" aria-label="开始游戏">
  <div class="tc">
    <div class="tm"><div class="tt">扶摇</div><div class="seal">逍遥</div></div>
    <div class="tq">北冥有鱼　其名为鲲<br>化而为鸟　其名为鹏</div>
  </div>
  <div class="tf">
    <div class="snd" id="sndT"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg><span>开启声音，获得最好的体验</span><span class="sub" id="sndS"></span></div>
    <div class="tap">轻触 · 化鲲为鹏</div>
    <div class="best" id="bestT"></div>
    <div class="lks"><button class="lk" id="bDaily">今日之风</button><button class="lk" id="bScroll">寓言卷</button></div>
    <div class="best" id="dailyT"></div>
  </div>
</div>
<div id="cred">配乐改编自《神奇秘谱》古琴曲《列子御风》<br>部分音色 FluidR3_GM · Frank Wen · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a></div>
<div id="over" class="scr">
  <div class="sheet">

      let gx = flock.cx, gy = flock.cy - 170, best = null, bd = 1e9;
      for (const gp of actGrp) { if (gp.done) continue; const dy = flock.cy - gp.cy; if (dy < -40 || dy > 650) continue; const d = Math.hypot(gp.cx - flock.cx, dy); if (d < bd) { bd = d; best = gp; } }
      if (best) { gx = best.cx; gy = Math.min(best.cy, flock.cy - 60); }
      for (const o of actObs) { // string the lights of a trail, ride a wind lane
        if (o.t === 8 && !o.done && !best) { for (let k = 0; k < o.n; k++) if (!o.got[k] && o.pts[k][1] < flock.cy + 20 && flock.cy - o.pts[k][1] < 450) { gx = o.pts[k][0]; gy = o.pts[k][1] - 40; break; } }
        else if (o.t === 15 && flock.cy > o.y0 && flock.cy < o.y1 + 300) gx = o.x;
      }
      for (const o of actObs) {
        if (o.t === 1) { const top = Math.min(o.y0, o.y1); if (top < flock.cy && flock.cy - top < 320) gx = o.side < 0 ? Math.max(gx, o.x1 + 80) : Math.min(gx, o.x1 - 80); }
        else if (o.t === 2 && o.y < flock.cy && flock.cy - o.y < 320 && Math.abs(gx - o.x) < o.cr + 70) { walls(-o.y); gx = (o.x - W_L > W_R - o.x) ? o.x - o.cr - 90 : o.x + o.cr + 90; }
        else if (o.t === 6 && o.main && o.y0 < flock.cy + 20 && flock.cy - o.y0 < 380) gx = (o.br.gx0 + o.br.gx1) / 2;
        else if (o.t === 9 && !o.open && o.y < flock.cy + 10 && flock.cy - o.y < 420) gx = nB >= o.need ? (o.d0 + o.d1) / 2 : (o.gx0 + o.gx1) / 2; // push the gate together, or take the gap
      }
      if (dragon.st) { const yc = camY + dragon.oy; gy = flock.cy > yc ? yc + dragon.amp + 170 : yc - dragon.amp - 170; }
      for (const m of meteors) { const L = Math.hypot(m.x1 - m.x0, m.y1 - m.y0), nx = -(m.y1 - m.y0) / L, ny = (m.x1 - m.x0) / L, sd = (flock.cx - m.x0) * nx + (flock.cy - m.y0) * ny >= 0 ? 1 : -1; gx = flock.cx + nx * sd * 160; gy = flock.cy + ny * sd * 160; }
      if (bolt.st === 1) { gx = bolt.x + (flock.cx < bolt.x ? -170 : 170); gy = flock.cy - 40; }
      for (const h of hawks) if (h.st === 2 || h.st === 3) {
        const vx = h.st === 2 ? h.aimx - h.x : h.vx, vy = h.st === 2 ? h.aimy - h.y : h.vy, L = Math.hypot(vx, vy) + 0.001, nx = -vy / L, ny = vx / L;
        const sd = (flock.cx - h.x) * nx + (flock.cy - h.y) * ny >= 0 ? 1 : -1; gx = flock.cx + nx * sd * 190; gy = flock.cy + ny * sd * 190;
      }
      tgt.sx = cssW / 2 + (gx - cam.x) * scale; tgt.sy = cssH / 2 + (gy - camY) * scale; clampTgt();
      if (canVortex()) tryVortex();
      else if (wing.cd <= 0 && (hawks.some(h => h.st === 2) || dragon.st === 1 || meteors.some(m => m.st === 0) || flock.cy > camY + viewH * 0.24)) tryWing();
    };
    requestAnimationFrame(tick);
  }
};/*/DEBUG*/
} catch (err) {
  const e = $('err'); if (e) e.style.display = 'block';
  if (window.console) console.error(err);
}
})();
