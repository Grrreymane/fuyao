<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>扶摇九万里 · 配乐试听</title>
<style>
@font-face{font-family:FYT;src:url(data:font/woff2;base64,__FYT__) format('woff2');font-display:block}
@font-face{font-family:FYK;src:url(data:font/woff2;base64,__FYK__) format('woff2');font-display:block}
:root{--paper:#ece5d6;--ink:#1c1a17;--soft:#5f584d;--red:#a5372b;--line:rgba(28,26,23,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 60% 35% at 100% 100%,rgba(70,60,45,.10),transparent 70%),repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 36px) calc(env(safe-area-inset-right) + 22px) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + 22px)}
header{position:relative;margin-bottom:26px}
h1{font:400 64px/1 FYT,serif;letter-spacing:.06em}
.sub{margin-top:12px;font:400 19px/1.3 FYK,serif;color:var(--soft);letter-spacing:.12em}
.seal{position:absolute;right:2px;top:6px;width:46px;height:46px;border:2.5px solid var(--red);border-radius:5px;color:var(--red);font:400 28px/40px FYK,serif;text-align:center;transform:rotate(-5deg);opacity:.85}
h2{font:400 22px/1.2 FYK,serif;letter-spacing:.14em;margin:26px 0 10px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;height:1px;background:var(--line)}
.card{display:flex;align-items:center;gap:16px;padding:16px 4px 16px 0;border-bottom:1px solid var(--line)}
.pl{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.pl:before{content:"";position:absolute;left:23px;top:18px;border-style:solid;border-width:11px 0 11px 17px;border-color:transparent transparent transparent var(--paper)}
.card[data-s=play] .pl{background:var(--red)}
.card[data-s=play] .pl:before{left:21px;top:21px;border:0;width:16px;height:16px;background:var(--paper);border-radius:2px}
.card[data-s=load] .pl:before{left:17px;top:17px;width:24px;height:24px;border:3px solid rgba(236,229,214,.35);border-top-color:var(--paper);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pl:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.tx{flex:1;min-width:0}
h3{font:400 23px/1.25 FYK,serif;letter-spacing:.06em}
.tx p{color:var(--soft);font-size:14px;margin-top:3px}
.nw{white-space:nowrap}
.bar{height:2px;background:var(--line);margin-top:10px;overflow:hidden;border-radius:1px}
.bar i{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left}
.card[data-s=play] .bar i{background:var(--red)}
.old .pl{width:46px;height:46px}
.old .pl:before{left:18px;top:13px;border-width:10px 0 10px 15px}
.old .card[data-s=play] .pl:before{left:16px;top:16px;width:14px;height:14px}
.old .card[data-s=load] .pl:before{left:12px;top:12px}
.old h3{font-size:20px}
#status{min-height:22px;margin-top:14px;color:var(--red);font-size:14px}
footer{margin-top:22px;color:var(--soft);font-size:12.5px;line-height:1.75}
footer b{font-weight:600;color:var(--ink)}
@media (max-width:380px){h1{font-size:54px}.card{gap:13px}h3{font-size:21px}}
@media (min-width:700px){main{padding-top:64px}h1{font-size:76px}}
@media (prefers-reduced-motion:reduce){.card[data-s=load] .pl:before{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>列子御风</h1>
    <p class="sub">扶摇九万里 · 配乐试听小样</p>
    <div class="seal" aria-hidden="true">听</div>
  </header>

  <h2>新版</h2>
  <article class="card" data-k="sanxu" data-s="idle">
    <button class="pl" aria-label="播放 第一重 · 散序"></button>
    <div class="tx"><h3>第一重 · 散序</h3><p>古琴泛音起调，箫在远处应和。取自第一段<span class=nw>「凭虚驭风」</span>。</p><div class="bar"><i></i></div></div>
  </article>
  <article class="card" data-k="rupo" data-s="idle">
    <button class="pl" aria-label="播放 第八重 · 入破"></button>
    <div class="tx"><h3>第八重 · 入破</h3><p>同一支曲子提到急板，琵琶加花，锣鼓催阵。取自第二段<span class=nw>「俯视寰壤」</span>。</p><div class="bar"><i></i></div></div>
  </article>

  <section class="old">
    <h2>现版 · 对比</h2>
    <article class="card" data-k="old0" data-s="idle">
      <button class="pl" aria-label="播放 现版 · 第一重"></button>
      <div class="tx"><h3>现版 · 第一重</h3><div class="bar"><i></i></div></div>
    </article>
    <article class="card" data-k="old7" data-s="idle">
      <button class="pl" aria-label="播放 现版 · 第八重"></button>
      <div class="tx"><h3>现版 · 第八重</h3><div class="bar"><i></i></div></div>
    </article>
  </section>

  <p id="status" role="status"></p>

  <footer>
    <p><b>旋律</b>取自明代《神奇秘谱》（1425）所收古琴曲《列子御风》，古谱已属公有领域；节奏与配器为本游戏重新编写。</p>
    <p><b>音色</b>中的箫、筝、琵琶、鼓暂用尺八、日本筝、三味线、太鼓的采样代替，来自 FluidR3_GM 音色库（Frank Wen，CC BY 3.0）。古琴、笙、锣、钹为程序合成。</p>
    <p>建议戴耳机试听。</p>
  </footer>
</main>
<script>window.MU_SAMPLES = __SAMPLES__;</script>
<script>
/* the current game's audio module needs these from the game; kept here only for the comparison buttons */
const STAGES = [{ mode: 4 }, { mode: 3 }, { mode: 0 }, { mode: 1 }, { mode: 4 }, { mode: 3 }, { mode: 4 }, { mode: 1 }, { mode: 0 }];
const NST = 9;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function makeRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/*@include audio.js*/
/*@include music.js*/
(() => {
  const cards = [...document.querySelectorAll('.card')], statusEl = document.getElementById('status');
  const OLD = { old0: 0, old7: 7 }, OLD_LEN = 28;
  let cur = null, lastT = performance.now();
  const status = s => { statusEl.textContent = s; };
  function setState(card, s) {
    card.dataset.s = s;
    const name = card.querySelector('h3').textContent;
    card.querySelector('.pl').setAttribute('aria-label', (s === 'idle' ? '播放 ' : '停止 ') + name);
  }
  const bar = (card, p) => { card.querySelector('.bar i').style.transform = 'scaleX(' + Math.min(1, Math.max(0, p)).toFixed(4) + ')'; };
  function stopAll() {
    MU.stop();
    if (cur && cur.old) AU.suspend(true);
    if (cur) { setState(cur.card, 'idle'); bar(cur.card, 0); }
    cur = null;
  }
  async function start(card) {
    const k = card.dataset.k;
    stopAll();
    status('');
    if (k in OLD) {
      AU.init();
      if (!AU.ready) { status('这个浏览器不支持网页音频。'); return; }
      AU.suspend(false); AU.music(OLD[k]);
      cur = { card, old: true, t0: performance.now(), dur: OLD_LEN };
      setState(card, 'play');
      return;
    }
    const me = { card, loading: true };
    cur = me;
    setState(card, 'load');
    if (!MU.ready) status('正在载入音色……');
    try { await MU.init(); } catch (e) {
      if (cur === me) { setState(card, 'idle'); cur = null; }
      status('音色载入失败：' + (e && e.message ? e.message : e));
      return;
    }
    if (cur !== me) return; // tapped something else while loading
    status('');
    const dur = MU.play(k);
    cur = { card, dur };
    setState(card, 'play');
  }
  for (const c of cards) c.querySelector('.pl').addEventListener('click', () => { if (cur && cur.card === c) stopAll(); else start(c); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && cur) stopAll(); });
  function loop(now) {
    const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
    if (cur && cur.old) {
      AU.tick(dt);
      const p = (now - cur.t0) / 1000 / cur.dur; bar(cur.card, p);
      if (p >= 1) stopAll();
    } else if (cur && cur.dur) {
      const pr = MU.progress();
      if (pr) { bar(cur.card, pr.t / pr.dur); if (pr.t >= pr.dur) stopAll(); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  /*DEBUG*/window.__demo = { stopAll, state: () => cur && { k: cur.card.dataset.k, old: !!cur.old, loading: !!cur.loading } };/*/DEBUG*/
})();
</script>
</body>
</html>
