:root{color-scheme:light;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--zhu:#b3312a;--hud:#1d1a16;--hudr:29,26,22;--shd:236,230,216;--sealm:none}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b1013;overscroll-behavior:none}
body{position:fixed;inset:0;font-family:FYK,"Kaiti SC",STKaiti,KaiTi,serif;color:var(--hud);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
body.dk{--hud:#efe8d7;--hudr:239,232,215;--shd:8,10,18}
#g{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#paper,#vig{position:fixed;inset:0;pointer-events:none}
#paper{mix-blend-mode:multiply;opacity:.5;background-size:256px 256px}
#vig{background:radial-gradient(120% 92% at 50% 45%,rgba(0,0,0,0) 56%,rgba(38,26,12,.34) 100%);mix-blend-mode:multiply}
.seal{display:inline-flex;align-items:center;justify-content:center;background:var(--zhu);color:#f8efe0;font-family:FYT,serif;font-weight:400;line-height:1;border-radius:3px;writing-mode:vertical-rl;-webkit-mask-image:var(--sealm);mask-image:var(--sealm);-webkit-mask-size:100% 100%;mask-size:100% 100%}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .8s}
#hud.off{opacity:0}
#hud.off #btns{pointer-events:none}
#cnt{position:absolute;left:calc(var(--sl) + 14px);top:calc(var(--st) + 14px);display:flex;align-items:center;gap:10px;font-size:27px;line-height:1;text-shadow:0 0 10px rgba(var(--shd),.8)}
#cnt .seal{width:31px;height:31px;font-size:21px}
#cntv{display:inline-block;min-width:3ch;transition:transform .18s ease-out}
.sealw{position:relative;display:inline-grid;place-items:center;--w:0}
.sealw::before{content:'';position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(rgba(var(--hudr),.62) calc(var(--w) * 360deg),rgba(var(--hudr),.14) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.sealw.full::before{background:#d9a640;filter:drop-shadow(0 0 6px rgba(240,190,80,.9));animation:breathe 1.2s ease-in-out infinite}
.sealw .seal{transition:filter .25s,opacity .25s}
.sealw.cd .seal{filter:grayscale(1) brightness(1.1);opacity:.5}
#bPeng{position:absolute;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 17vh);width:66px;height:66px;font-size:40px;border:0;padding:0;cursor:pointer;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .35s,transform .35s}
#bPeng.on{opacity:1;pointer-events:auto;transform:scale(1);animation:pulse 1.3s ease-in-out infinite}
#hud.off #bPeng{pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#cntv.pop{transform:scale(1.28)}
#btns{position:absolute;left:calc(var(--sl) + 4px);top:calc(var(--st) + 52px);display:flex;gap:2px;pointer-events:auto}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--hud);display:grid;place-items:center;cursor:pointer;opacity:.72}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:focus-visible,.btn:focus-visible,#title:focus-visible{outline:2px solid var(--zhu);outline-offset:3px}
#alt{position:absolute;right:calc(var(--sr) + 14px);top:calc(var(--st) + 16px);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:10px}
#altv{writing-mode:vertical-rl;font-size:22px;line-height:1.1;letter-spacing:.06em;text-shadow:0 0 10px rgba(var(--shd),.85)}
#prog{position:relative;width:3px;height:min(32vh,250px);margin-top:4px;border-radius:2px;background:rgba(var(--hudr),.16)}
#progf{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:2px;background:var(--zhu)}
#prog b{position:absolute;left:-3px;width:9px;height:1px;background:rgba(var(--hudr),.42)}
#card{position:fixed;left:calc(var(--sl) + 6vw);top:calc(var(--st) + 16vh);display:flex;flex-direction:row-reverse;align-items:flex-start;gap:12px;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity 1.1s ease,transform 1.8s ease;text-shadow:0 0 14px rgba(var(--shd),.9)}
#card.on{opacity:1;transform:none}
#card .cn{writing-mode:vertical-rl;font-size:18px;letter-spacing:.3em;opacity:.82}
#card .cm{writing-mode:vertical-rl;font-family:FYT,serif;font-size:clamp(64px,17vw,118px);line-height:1}
#card .cq{font-size:clamp(17px,4.4vw,22px);line-height:1.55;letter-spacing:.14em;margin-top:8px;opacity:.92}
#card .cs{writing-mode:vertical-rl;font-size:13px;letter-spacing:.2em;margin-top:12px;opacity:.62}
#card .cm{position:relative}
#card .cm::before{content:'';position:absolute;left:50%;top:50%;width:2.4em;height:2.4em;margin:-1.2em 0 0 -1.2em;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--hudr),.16),rgba(var(--hudr),.06) 55%,rgba(var(--hudr),0));z-index:-1;opacity:0;transform:scale(.2)}
#card.on .cm{animation:bloom 1.8s cubic-bezier(.2,.7,.2,1) both}
#card.on .cm::before{animation:blot 2.4s ease-out both}
#card.on .cq span{animation:bloom 1.5s cubic-bezier(.2,.7,.2,1) .35s both}
#card.on .cq span:nth-child(2){animation-delay:.6s}
#card.on .cq span:nth-child(3){animation-delay:.85s}

    scrollV += (sval(cam.alt, 'scroll') * ramp - scrollV) * Math.min(1, dt * 1.5);
    cam.alt += scrollV * dt;
    if (nB) { const want = -flock.cy + viewH * 0.06; if (want > cam.alt) cam.alt += (want - cam.alt) * Math.min(1, dt * 3); }
    walls(nB ? -flock.cy : cam.alt);
    cam.x += (clamp(W_C, -PAN, PAN) - cam.x) * Math.min(1, dt * 1.6);
    camY = -cam.alt;
    stepPlay(dt);
  } else if (state === 'finale' || state === 'win') { updFinale(dt); }
  palAt(cam.alt, PN);
  updScene(dt);
  updPlay(dt);
  if (state !== 'title') { updDragon(dt); updMeteors(dt); }
  updFlyers(dt); updFg(dt);
  updClouds(dt); ambient(dt); updParts(dt);
  const st = STAGES[stageIdx(cam.alt)];
  let water = 0;
  for (const o of actObs) if (o.t === 3) { const dx = Math.max(0, Math.abs((o.x0 + o.x1) / 2 - flock.cx) - 30), dy = Math.max(0, o.y0 - flock.cy, flock.cy - o.y1); water = Math.max(water, 1 - Math.hypot(dx, dy) / 500); }
  const sp = Math.hypot(flock.vx, flock.vy);
  AU.env(state === 'title' ? 0.12 : 0.12 + clamp(sp / 300, 0, 1) * 0.25 + gust.k * 0.6 + (st.amb === 'wind' ? 0.2 : 0), st.amb === 'rain' && state !== 'title' ? 1 : 0, water);
  AU.tick(dt);
  updTheme();
}

/* ================= input ================= */
let ptrId = null, lastX = 0, lastY = 0;
const keys = {};
function clampTgt() { tgt.sx = clamp(tgt.sx, cssW * 0.05, cssW * 0.95); tgt.sy = clamp(tgt.sy, cssH * 0.1, cssH * 0.8); }
const tap = { t0: 0, moved: 0, upT: -1, upX: 0, upY: 0 };
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') { tgt.sx = e.clientX; tgt.sy = e.clientY; clampTgt(); if (e.button === 0) tryWing(); return; }
  if (ptrId !== null && e.pointerId !== ptrId) { tryWing(); return; }
  const now = performance.now();
  if (now - tap.upT < 320 && Math.hypot(e.clientX - tap.upX, e.clientY - tap.upY) < 60) { tap.upT = -1; tryWing(); }
  tap.t0 = now; tap.moved = 0;
  ptrId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { if (state === 'play' || state === 'intro' || state === 'dying') { dragDist += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0); } tgt.sx = e.clientX; tgt.sy = e.clientY; clampTgt(); return; }
  if (e.pointerId !== ptrId) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY; tap.moved += Math.abs(dx) + Math.abs(dy);
  tgt.sx += dx * 1.35; tgt.sy += dy * 1.35; clampTgt();
  dragDist += Math.abs(dx) + Math.abs(dy);
});
const endPtr = e => {
  if (e.pointerId === ptrId) {
    ptrId = null;
    const now = performance.now();
    if (now - tap.t0 < 250 && tap.moved < 18) { tap.upT = now; tap.upX = e.clientX; tap.upY = e.clientY; }
  }
  AU.init();
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', e => { if (e.pointerId === ptrId) ptrId = null; });
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.key === 'Escape' && $('share').classList.contains('on')) { closeShare(); return; }
  if (e.key === 'Escape' && $('scroll').classList.contains('on')) { closeScroll(); return; }
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && !e.repeat) setPause(!paused);
  if ((e.key === 'Enter' || e.key === ' ') && state === 'title') { e.preventDefault(); startGame(); }
  else if (e.key === ' ' && state === 'play') { e.preventDefault(); if (!e.repeat) tryWing(); }
  if ((e.key === 'e' || e.key === 'E') && !e.repeat) tryPeng();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
function keyMove(dt) {
  const kx = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
  const ky = (keys.ArrowDown || keys.s || keys.S ? 1 : 0) - (keys.ArrowUp || keys.w || keys.W ? 1 : 0);
  if (kx || ky) { tgt.sx += kx * 560 * dt; tgt.sy += ky * 560 * dt; clampTgt(); dragDist += 10; }
}
function startGame() {
  if (state !== 'title') return;
  AU.init(); AU.music(0);
  $('title').classList.remove('on');
  startIntro();
}
$('title').addEventListener('click', startGame);
$('again').addEventListener('click', () => { AU.init(); restart(); });
$('again2').addEventListener('click', () => { AU.init(); restart(); });
$('resume').addEventListener('click', e => { e.stopPropagation(); setPause(false); });
$('pause').addEventListener('click', () => setPause(false));
$('bPau').addEventListener('click', () => setPause(true));
function toggleSound() {
  AU.init();
  const m = AU.toggle();
  $('sndOn').style.display = m ? 'none' : ''; $('sndOff').style.display = m ? '' : 'none';
  $('bSnd').setAttribute('aria-pressed', m ? 'true' : 'false');
}
$('bSnd').addEventListener('click', toggleSound);
if (AU.isMuted()) { $('sndOn').style.display = 'none'; $('sndOff').style.display = ''; }
document.addEventListener('visibilitychange', () => { if (document.hidden) setPause(true); });
let resizeTO = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTO); resizeTO = setTimeout(resize, 120); });

/* ================= loop ================= */
function resize() {
  cssW = Math.max(1, window.innerWidth); cssH = Math.max(1, window.innerHeight);
  dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, dprMax, Math.sqrt(3.4e6 / (cssW * cssH))));
  W = Math.round(cssW * dpr); H = Math.round(cssH * dpr);
  cv.width = W; cv.height = H;
  scale = Math.min(cssW / 640, cssH / 1060); pxu = scale * dpr;
  viewW = cssW / scale; viewH = cssH / scale;
  XEXT = viewW / 2 + PAN + 50; tideU = clamp(cssH * 0.085, 44, 92) / scale;
  clearChunks(); buildSprites();
  freeScenes(true); for (const k in FGS) { FGS[k].c.width = FGS[k].c.height = 0; delete FGS[k]; }
  stepScene(sceneIdx, true);
  tgt.sx = tgt.sx || cssW / 2; tgt.sy = tgt.sy || cssH * 0.52; clampTgt();
  if (state === 'title') { cam.alt = viewH * 0.32; camY = -cam.alt; }
}
let last = 0, slowT = 0, drawnPaused = false;
const perf = { fps: 60 };
function loop(now) {
  requestAnimationFrame(loop);
  if (!last) { last = now; return; }
  let dt = (now - last) / 1000;
  last = now;
  if (dt <= 0) return;
  if (dt > 0.1) dt = 0.1;
  perf.fps = perf.fps * 0.95 + (1 / dt) * 0.05;
  if (!paused) {
    keyMove(dt);
    if (state === 'dying') { dyingReal += dt; if (dyingReal > 1.4) gameOver(); }
    const sdt = dt * timeScale, n = sdt > 1 / 45 ? 2 : 1;
    for (let k = 0; k < n; k++) step(sdt / n);
    render(dt * timeScale); drawnPaused = false;
    if (state === 'play' && perf.fps < 38) { slowT += dt; if (slowT > 3 && dprMax > 1) { dprMax = Math.max(1, Math.min(dprMax, dpr) - 0.5); slowT = 0; resize(); } } else slowT = 0;
  } else if (!drawnPaused) { render(0); drawnPaused = true; }
}
resize(); makePaper(); makeSealMask(); newGame(); showBest(); showDaily(); palAt(cam.alt, PN);
if (document.fonts && document.fonts.load) { document.fonts.load('26px FYK').catch(() => {}); }
requestAnimationFrame(loop);

} catch (err) {
  const e = $('err'); if (e) e.style.display = 'block';
  if (window.console) console.error(err);
}
})();
